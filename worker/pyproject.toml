[project]
name = "schedule-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13.0",
  "asyncpg>=0.30.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.35",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
